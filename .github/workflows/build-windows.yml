name: Build AutoCrispy

on:
  push:
    branches:
      - master
      - "arena/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for runner tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image-processing test dependencies
        run: python -m pip install --disable-pip-version-check numpy Pillow

      - name: Run Spandrel runner tests
        run: python -m unittest discover -s AutoCrispy/AutoCrispy/tests -v

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: |
          $buildOutput = @(& msbuild AutoCrispy\AutoCrispy.sln /t:Rebuild /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal 2>&1 | ForEach-Object { "$_" })
          $buildExitCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Output $_ }
          if ($buildExitCode -ne 0) {
            foreach ($line in $buildOutput | Where-Object { $_ -match '\berror\s+(BC\d+|MSB\d+)' }) {
              Write-Output "::error::$line"
            }
          }
          exit $buildExitCode

      - name: Verify Python helpers were copied
        shell: pwsh
        run: |
          $helpers = @(
            "AutoCrispy\AutoCrispy\bin\Release\spandrel_upscale.py",
            "AutoCrispy\AutoCrispy\bin\Release\openmodeldb_catalog.py"
          )
          foreach ($helper in $helpers) {
            if (-not (Test-Path $helper)) {
              throw "Expected build output to contain $helper"
            }
          }

      - name: Upload Release build
        uses: actions/upload-artifact@v4
        with:
          name: AutoCrispy-Windows-Release
          path: AutoCrispy/AutoCrispy/bin/Release/**
          if-no-files-found: error
          retention-days: 7
  ui-scaling-probe:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile scaling probe
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc not found" }
          & $csc /nologo /target:exe /out:probe.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll .github\diagnostics\ScalingProbe.cs
          if (-not (Test-Path probe.exe)) { throw "probe did not compile" }

      - name: Run scaling probe
        shell: pwsh
        run: |
          $lines = & .\probe.exe
          $lines | Where-Object { $_ -notmatch '^PROBE\|' } | Write-Host
          $lines | Where-Object { $_ -match '^PROBE\|' } | Select-Object -First 20 | ForEach-Object {
            Write-Host "::notice title=WinForms scaling probe::$($_.Substring(6))"
          }
